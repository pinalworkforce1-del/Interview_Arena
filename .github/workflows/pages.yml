name: Deploy Interview Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore production source
        run: |
          cat interview-arena-source.tar.gz.part-* > interview-arena-source.tar.gz
          mkdir restored
          tar -xzf interview-arena-source.tar.gz -C restored
      - name: Apply Level Up UX Standard v1
        run: |
          cp level-up-standard.css restored/dist/level-up-standard.css
          cp level-up-standard.js restored/dist/level-up-standard.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('restored/dist/index.html')
          s = p.read_text()
          s = s.replace('</head>', '<link rel="stylesheet" href="./level-up-standard.css"></head>')
          s = s.replace('</body>', '<script src="./level-up-standard.js"></script></body>')
          p.write_text(s)
          PY
      - name: Add Offline Engine
        run: |
          cp offline-sw.js restored/dist/offline-sw.js
          cp offline-client.js restored/dist/offline-client.js
          cp offline-progress.js restored/dist/offline-progress.js
          python3 - <<'PY'
          from pathlib import Path

          p = Path('restored/dist/index.html')
          s = p.read_text()
          if 'offline-client.js' not in s:
              s = s.replace('</body>', '<script defer src="./offline-client.js"></script><script defer src="./offline-progress.js"></script></body>')
          p.write_text(s)

          app = Path('restored/dist/app.js')
          s = app.read_text()
          old = "function save(){state.savedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));scheduleCloudSync()}"
          new = "function save(){state.savedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));window.LevelUpOfflineProgress?.save(MODULE_ID,state,{xp:state.xp,isComplete:state.complete,completedAt:state.complete?state.savedAt:null,updatedAt:state.savedAt});scheduleCloudSync()}"
          if old not in s:
              raise SystemExit('Interview Arena save hook signature changed; offline patch not applied')
          s = s.replace(old, new)

          old_sync = "cloud.status=res.ok?'synced':'offline'}catch{cloud.status='offline'}}"
          new_sync = "cloud.status=res.ok?'synced':'offline';if(res.ok)window.LevelUpOfflineProgress?.markSynced(MODULE_ID)}catch{cloud.status='offline'}}"
          if old_sync not in s:
              raise SystemExit('Interview Arena cloud sync signature changed; markSynced patch not applied')
          s = s.replace(old_sync, new_sync, 1)
          app.write_text(s)
          PY

      - name: Verify offline progress integration
        run: |
          grep -q "LevelUpOfflineProgress?.save(MODULE_ID" restored/dist/app.js
          grep -q "LevelUpOfflineProgress?.markSynced(MODULE_ID" restored/dist/app.js
          node --check restored/dist/app.js

      - name: Generate offline manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('restored/dist')
          rows = []
          total = 0
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.name == 'offline-manifest.json':
                  continue
              rel = './' + p.relative_to(root).as_posix()
              size = p.stat().st_size
              rows.append({'path': rel, 'bytes': size})
              total += size
          manifest = {
              'engine':'Level Up Offline Engine',
              'version':'1.0.0',
              'scope':'/Interview_Arena/',
              'totalBytes':total,
              'files':rows,
          }
          (root / 'offline-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n', encoding='utf-8')
          print(f"Offline manifest: {len(rows)} files, {total/1024/1024:.1f} MB")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: restored/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
