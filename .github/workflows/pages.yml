name: Deploy Interview Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore production source
        run: |
          cat interview-arena-source.tar.gz.part-* > interview-arena-source.tar.gz
          mkdir restored
          tar -xzf interview-arena-source.tar.gz -C restored
      - name: Bind accessibility to native Interview Arena state
        run: |
          python3 scripts/patch-native-accessibility.py restored/dist/app.js
          grep -q "settings:{auto:true,captions:true,reduce:false,large:false,playbackRate:1}" restored/dist/app.js
          grep -Fq "state.settings.auto?'autoplay':''" restored/dist/app.js
          grep -q "lu-hide-captions" restored/dist/app.js
          grep -q "lu-reduce-motion" restored/dist/app.js
          node --check restored/dist/app.js
      - name: Keep AI mock interview available after completion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('level-up-standard.js')
          s = p.read_text(encoding='utf-8')
          old = '''  function ensureMockInterviewEntry(stage){
    const title=(document.querySelector('.progress-meta span')?.textContent||document.querySelector('.scene-status')?.textContent||'').toLowerCase();
    const finalScene=/quest complete|scene 11|complete/.test(title);
    let b=document.getElementById('luMockInterviewEntry');
    if(!finalScene){if(b)b.remove();return}
    if(b)return;
    const nav=stage.querySelector('.navrow')||stage;
    b=document.createElement('button');
    b.id='luMockInterviewEntry';
    b.type='button';
    b.className='nav-btn next';
    b.style.marginLeft='8px';
    const syncMockAvailability=()=>{
      const online=navigator.onLine;
      b.disabled=!online;
      b.textContent=online?'⚔ Launch AI Mock Interview • 200 XP':'⚔ AI Mock Interview • Online connection required';
      b.title=online?'Launch AI Mock Interview':'Available when you are back online';
    };
    syncMockAvailability();
    b.addEventListener('click',()=>{
      if(!navigator.onLine)return;
      const target='https://pinalworkforce1-del.github.io/LU_Discovery/mock-interview.html?mode=selfpaced&returnTo='+encodeURIComponent(location.href);
      location.href=target;
    });
    window.addEventListener('online',syncMockAvailability);
    window.addEventListener('offline',syncMockAvailability);
    nav.appendChild(b);
  }
'''
          new = '''  function mockInterviewEarned(){
    try{
      if(typeof state!=='undefined'&&Array.isArray(state.earned)&&state.earned.includes('mock-interview'))return true;
      const saved=JSON.parse(localStorage.getItem('level-up-interview-arena-v3')||'{}');
      return Array.isArray(saved.earned)&&saved.earned.includes('mock-interview');
    }catch(_){return false}
  }

  function ensureMockInterviewEntry(stage){
    const title=(document.querySelector('.progress-meta span')?.textContent||document.querySelector('.scene-status')?.textContent||'').toLowerCase();
    const finalScene=/quest complete|scene 11|complete/.test(title);
    let moduleComplete=false;
    try{moduleComplete=typeof state!=='undefined'&&!!state.complete}catch(_){}
    let b=document.getElementById('luMockInterviewEntry');
    if(!finalScene&&!moduleComplete){if(b)b.remove();return}
    const syncMockAvailability=()=>{
      if(!b)return;
      const online=navigator.onLine;
      const earned=mockInterviewEarned();
      b.disabled=!online;
      b.textContent=online?(earned?'⚔ Practice AI Mock Interview':'⚔ Launch AI Mock Interview • 200 XP'):'⚔ AI Mock Interview • Online connection required';
      b.title=online?(earned?'Practice another AI mock interview':'Launch AI Mock Interview'):'Available when you are back online';
    };
    if(!b){
      const nav=stage.querySelector('.navrow')||stage;
      b=document.createElement('button');
      b.id='luMockInterviewEntry';
      b.type='button';
      b.className='nav-btn lu-mock-interview-entry';
      b.style.marginLeft='8px';
      b.addEventListener('click',()=>{
        if(!navigator.onLine)return;
        const target='https://pinalworkforce1-del.github.io/LU_Discovery/mock-interview.html?mode=selfpaced&returnTo='+encodeURIComponent(location.href);
        location.href=target;
      });
      window.addEventListener('online',syncMockAvailability);
      window.addEventListener('offline',syncMockAvailability);
      nav.appendChild(b);
    }
    syncMockAvailability();
  }
'''
          if old not in s:
              raise SystemExit('Mock interview launch signature changed; reusable practice patch not applied')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q "Practice AI Mock Interview" level-up-standard.js
          grep -q "moduleComplete" level-up-standard.js
          node --check level-up-standard.js
      - name: Apply Level Up UX Standard v3
        run: |
          VERSION="${GITHUB_SHA:0:12}"
          cp level-up-standard.css "restored/dist/level-up-standard.${VERSION}.css"
          cp level-up-standard.js "restored/dist/level-up-standard.${VERSION}.js"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['GITHUB_SHA'][:12]
          p = Path('restored/dist/index.html')
          s = p.read_text()

          # Remove any previously injected Level Up standard assets/marker before inserting this build.
          s = re.sub(r'<meta name="level-up-standard-version" content="[^"]*">', '', s)
          s = re.sub(r'<link rel="stylesheet" href="\./level-up-standard(?:\.[^"]+)?\.css">', '', s)
          s = re.sub(r'<script src="\./level-up-standard(?:\.[^"]+)?\.js"></script>', '', s)

          css_name = f'level-up-standard.{version}.css'
          js_name = f'level-up-standard.{version}.js'
          s = s.replace(
              '</head>',
              f'<meta name="level-up-standard-version" content="{version}"><link rel="stylesheet" href="./{css_name}"></head>'
          )
          s = s.replace('</body>', f'<script src="./{js_name}"></script></body>')
          p.write_text(s)
          PY
          grep -q "level-up-standard.${VERSION}.css" restored/dist/index.html
          grep -q "level-up-standard.${VERSION}.js" restored/dist/index.html
          test -f "restored/dist/level-up-standard.${VERSION}.css"
          test -f "restored/dist/level-up-standard.${VERSION}.js"
      - name: Add Offline Engine
        run: |
          cp offline-sw.js restored/dist/offline-sw.js
          cp offline-client.js restored/dist/offline-client.js
          cp offline-progress.js restored/dist/offline-progress.js
          python3 - <<'PY'
          from pathlib import Path

          p = Path('restored/dist/index.html')
          s = p.read_text()
          if 'offline-client.js' not in s:
              s = s.replace('</body>', '<script defer src="./offline-client.js"></script><script defer src="./offline-progress.js"></script></body>')
          p.write_text(s)

          app = Path('restored/dist/app.js')
          s = app.read_text()
          old = "function save(){state.savedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));scheduleCloudSync()}"
          new = "function save(){state.savedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));window.LevelUpOfflineProgress?.save(MODULE_ID,state,{xp:state.xp,isComplete:state.complete,completedAt:state.complete?state.savedAt:null,updatedAt:state.savedAt});scheduleCloudSync()}"
          if old not in s:
              raise SystemExit('Interview Arena save hook signature changed; offline patch not applied')
          s = s.replace(old, new)

          old_sync = "cloud.status=res.ok?'synced':'offline'}catch{cloud.status='offline'}}"
          new_sync = "cloud.status=res.ok?'synced':'offline';if(res.ok)window.LevelUpOfflineProgress?.markSynced(MODULE_ID)}catch{cloud.status='offline'}}"
          if old_sync not in s:
              raise SystemExit('Interview Arena cloud sync signature changed; markSynced patch not applied')
          s = s.replace(old_sync, new_sync, 1)
          app.write_text(s)
          PY

      - name: Verify Level Up state + offline progress integration
        run: |
          grep -q "LevelUpOfflineProgress?.save(MODULE_ID" restored/dist/app.js
          grep -q "LevelUpOfflineProgress?.markSynced(MODULE_ID" restored/dist/app.js
          grep -q "settings:{auto:true,captions:true,reduce:false,large:false,playbackRate:1}" restored/dist/app.js
          grep -q "function nativeSettings()" "restored/dist/level-up-standard.${GITHUB_SHA:0:12}.js"
          grep -q "Practice AI Mock Interview" "restored/dist/level-up-standard.${GITHUB_SHA:0:12}.js"
          if grep -q "lu-interview-auto-narration" "restored/dist/level-up-standard.${GITHUB_SHA:0:12}.js"; then
            echo "Legacy adapter-local accessibility state is still present"
            exit 1
          fi
          node --check restored/dist/app.js
          node --check "restored/dist/level-up-standard.${GITHUB_SHA:0:12}.js"

      - name: Generate offline manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('restored/dist')
          rows = []
          total = 0
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.name == 'offline-manifest.json':
                  continue
              rel = './' + p.relative_to(root).as_posix()
              size = p.stat().st_size
              rows.append({'path': rel, 'bytes': size})
              total += size
          manifest = {
              'engine':'Level Up Offline Engine',
              'version':'1.0.0',
              'scope':'/Interview_Arena/',
              'totalBytes':total,
              'files':rows,
          }
          (root / 'offline-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n', encoding='utf-8')
          print(f"Offline manifest: {len(rows)} files, {total/1024/1024:.1f} MB")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: restored/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
