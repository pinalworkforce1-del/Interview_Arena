name: Extract Interview Arena Migration Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-migration-inspect.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore production source
        run: |
          cat interview-arena-source.tar.gz.part-* > interview-arena-source.tar.gz
          mkdir restored
          tar -xzf interview-arena-source.tar.gz -C restored
      - name: Build text inspection bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('restored')
          out=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              if p.suffix.lower() not in {'.html','.js','.css','.json','.md','.txt'}: continue
              if p.stat().st_size > 1500000: continue
              try: text=p.read_text(errors='replace')
              except Exception: continue
              out.append('\n\n===== FILE: '+str(p.relative_to(root))+' =====\n\n'+text)
          Path('migration-inspect.txt').write_text(''.join(out))
          print('inspection bytes',Path('migration-inspect.txt').stat().st_size)
          PY
      - name: Commit inspection bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration-inspect.txt
          git commit -m "Temporary Interview Arena migration inspection bundle" || exit 0
          git push
